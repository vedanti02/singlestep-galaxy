# From-scratch conditional WGAN-GP on top of the lf_init single-step
# generator (Li et al. 2021 PNAS / map2map precedent). Everything below
# `gan:` is new relative to lfinit_noskip_fixednorm.yaml; the MSE terms
# stay on as stabilizing anchors and the adversarial weight ramps in
# after 2 MSE-only epochs (critics train from epoch 0 regardless).
#
# Two conditional critics (models/discriminator.py), both fed the
# inner-cropped 24^3 cube with the LF field as conditioning channels:
#   D_disp: HF-LF residual displacement (Lagrangian space)
#   D_dens: log CIC density of the implied HF field (Eulerian space —
#           aimed directly at the P(k)/T(k)/r(k) eval metrics)
# model.z_dim=64 injects a latent into the conditioning token so the
# conditional generator can match the one-to-many LF->HF distribution.
#
# NOTE: config files are standalone (load_config does NOT merge
# default.yaml) — this is a full copy, not a delta.

data:
  root: /data/user_data/vkshirsa/lagrangian_output_64_fixed
  snapshot: PART_009
  crop_size: 32
  crop_overlap: 8
  fields: [disp, vel]
  reader: numpy
  box_size: 1000.0
  env_outside_mask: true
  augment: true

model:
  base_voxel: 32
  base_point: 128
  cond_dim:   256
  n_blocks:   4
  n_style:    5
  env_resolution: 64
  c_env: 4
  c_lf_pt: 0
  z_dim: 64            # latent for conditional stochasticity

optim:
  lr: 2.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  ema_decay: 0.999
  lr_schedule: warmup_cosine
  warmup_steps: 1000

train:
  epochs: 20
  batch_size: 4
  num_workers: 8
  val_every: 1
  ckpt_every: 1
  seed: 0
  device: cuda
  out_dir: /data/user_data/vkshirsa/singlestep_runs/pvfm_gan_scratch
  spectral_monitor_batches: 8

flow:
  mode: lf_init
  lambda_voxel: 0.5
  noise_sigma: 0.2

gan:
  enabled: true
  variant: wgan_gp
  d_base: 64
  d_lr: 1.0e-4
  d_betas: [0.0, 0.9]
  n_critic: 1
  gp_lambda: 10.0
  lambda_adv_disp: 5.0e-3
  lambda_adv_dens: 5.0e-3
  adv_ramp_start_epoch: 1
  adv_ramp_epochs: 2
  density_eps: 1.0e-6
  d_style_proj: false
