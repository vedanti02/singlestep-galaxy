# lf_init mode WITHOUT the lf_pt point-trunk skip connection.
# Removes the (x_t, lf_pt) shortcut that collapsed training loss to ~0
# while leaving inference (t=0, x=lf) untrained. The model now sees LF
# only via the U-Net voxel encoder (lf_voxel -> trilinear gather), so it
# must learn the conditioning-only path that inference actually uses.
#
# Also injects small Gaussian noise on x_t at training time as a
# belt-and-suspenders regularizer: any residual shortcut from
# voxel-encoded LF -> raw LF gets noised out, and the optimal velocity
# v* = HF - LF is preserved on expectation.

data:
  root: /data/group_data/universedata/lagrangian_output_64
  snapshot: PART_009
  crop_size: 32
  crop_overlap: 8
  fields: [disp, vel]
  reader: numpy
  box_size: 1000.0
  env_outside_mask: true
  augment: true

model:
  base_voxel: 32
  base_point: 128
  cond_dim:   256
  n_blocks:   4
  n_style:    5
  env_resolution: 64
  c_env: 4
  c_lf_pt: 0          # <-- drop the raw LF skip; the shortcut is gone

optim:
  lr: 2.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  ema_decay: 0.999
  lr_schedule: warmup_cosine
  warmup_steps: 1000

train:
  epochs: 20
  batch_size: 4
  num_workers: 8
  val_every: 1
  ckpt_every: 1
  seed: 0
  device: cuda
  out_dir: runs/pvfm_lfinit_noskip

flow:
  mode: lf_init
  lambda_voxel: 0.5
  noise_sigma: 0.2    # mild noise on x_t at training time
