# Variant of lfinit_noskip_proto.yaml with much lower noise_sigma to
# probe the noise/coherence tradeoff.
#
# Hypothesis: noise_sigma=0.2 was a belt-and-suspenders measure against
# the shortcut. With c_lf_pt=0 the principal shortcut is already gone;
# the U-Net -> trilinear-gather path can in principle recover some LF
# info but uses model capacity to do so. With less noise the model can
# produce sharper, more structured predictions that better match the
# target power spectrum / coherence — at the (modest) risk of letting
# the residual shortcut creep back in.

data:
  root: /data/group_data/universedata/lagrangian_output_64
  snapshot: PART_009
  crop_size: 32
  crop_overlap: 8
  fields: [disp]
  reader: numpy
  box_size: 1000.0
  env_outside_mask: true
  augment: true

model:
  base_voxel: 32
  base_point: 128
  cond_dim:   256
  n_blocks:   4
  n_style:    5
  env_resolution: 64
  c_env: 4
  c_lf_pt: 0

optim:
  lr: 2.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  ema_decay: 0.999
  lr_schedule: warmup_cosine
  warmup_steps: 500

train:
  epochs: 8
  batch_size: 4
  num_workers: 4
  prefetch_factor: 4
  max_train_crops: 25000
  val_every: 1
  ckpt_every: 1
  seed: 0
  device: cuda
  out_dir: runs/pvfm_noskip_lownoise

flow:
  mode: lf_init
  lambda_voxel: 0.5
  noise_sigma: 0.05    # 4x lower than the main run
